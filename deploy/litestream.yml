# Litestream 0.5 for Musha on Cloud Run: one SQLite file, replicated to Cloud Storage.
# deploy/entrypoint.sh restores it at start and runs the web process under
# `litestream replicate -exec`. ${...} values come from the environment:
#   MUSHA_DB_PATH           the SQLite file, /data/musha.db in the image
#   LITESTREAM_REPLICA_URL  this start's own generation, <base>/gen/<UTC start stamp>-<random>;
#                           entrypoint.sh adds gen/<name> to the base deploy.ps1 sets,
#                           gs://<bucket>/musha on Cloud Run and file:///<dir> for a local try
#   LITESTREAM_SOCKET       the control socket, for `litestream sync -wait`
# Cloud Storage access uses the service's own identity (application default credentials).

dbs:
  - path: ${MUSHA_DB_PATH}
    replica:
      url: ${LITESTREAM_REPLICA_URL}
      # A change reaches the bucket within a second while the instance has CPU.
      sync-interval: 1s
      # Off on purpose. An auto-recovery resets the local state mid-run: the local transaction ids
      # start again at 1, and once they pass the generation's last one, Litestream uploads changes
      # whose base never reached the bucket. A later restore splices the two lines of history and
      # either fails its full integrity check, which stops every start, or serves wrong rows.
      # Switched off, a replication error leaves the generation whole up to its last good change.
      # Litestream logs the error, and DurableWrites warns once a minute that writes reply before
      # the bucket holds them. A restart is the recovery: the next start restores that whole
      # generation and writes a new one from a full snapshot.
      auto-recover: false

# A start writes to an empty generation, so Litestream takes a full snapshot (ltx/9) as soon as it
# opens the database. Retention keeps a day of history inside a generation that lives that long.
snapshot:
  interval: 24h
  retention: 24h

# Fewer listings of the bucket while the instance idles.
l0-retention: 5m
l0-retention-check-interval: 1m

# Cloud Run gives a stopping instance 10 s. uvicorn takes up to 4 s of it; the final sync gets 5.
shutdown-sync-timeout: 5s
shutdown-sync-interval: 500ms

socket:
  enabled: true
  path: ${LITESTREAM_SOCKET}

logging:
  level: info
  type: text
