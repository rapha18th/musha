<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0070E0"/></marker>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#003087"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#F5F7FA"/>
  <rect width="1200" height="64" fill="#003087"/>
  <text x="32" y="41" font-size="24" font-weight="700" fill="#fff">Musha</text>
  <text x="122" y="41" font-size="16" fill="#9CC9FF">Ask · Hold · Prove · Release · Return, all on PayPal</text>

  <!-- People -->
  <text x="32" y="102" font-size="13" font-weight="700" fill="#5B6B80" letter-spacing="1">PEOPLE</text>
  <g>
    <rect x="32" y="116" width="250" height="150" rx="14" fill="#fff" stroke="#D6DEE8"/>
    <text x="52" y="146" font-size="17" font-weight="700" fill="#003087">Owner abroad</text>
    <text x="52" y="168" font-size="13" fill="#5B6B80">Chipo, Leicester</text>
    <text x="52" y="196" font-size="13" fill="#1A2B42">• Owner console: money, proof, books</text>
    <text x="52" y="218" font-size="13" fill="#1A2B42">• Approves with PayPal</text>
    <text x="52" y="240" font-size="13" fill="#1A2B42">• Calls the shop by voice</text>
  </g>
  <g>
    <rect x="32" y="300" width="250" height="150" rx="14" fill="#fff" stroke="#D6DEE8"/>
    <text x="52" y="330" font-size="17" font-weight="700" fill="#003087">Manager at home</text>
    <text x="52" y="352" font-size="13" fill="#5B6B80">Farai, Mbare, Harare</text>
    <text x="52" y="380" font-size="13" fill="#1A2B42">• Asks for money, Shona or English</text>
    <text x="52" y="402" font-size="13" fill="#1A2B42">• Sends receipt and goods photo</text>
    <text x="52" y="424" font-size="13" fill="#1A2B42">• Dashboard or WhatsApp</text>
  </g>
  <g>
    <rect x="32" y="484" width="250" height="96" rx="14" fill="#fff" stroke="#D6DEE8"/>
    <text x="52" y="514" font-size="17" font-weight="700" fill="#003087">Counter phone</text>
    <text x="52" y="540" font-size="13" fill="#1A2B42">• Pixel gate sends stills</text>
    <text x="52" y="562" font-size="13" fill="#1A2B42">• Proves deliveries arrived</text>
  </g>

  <!-- Musha core -->
  <text x="340" y="102" font-size="13" font-weight="700" fill="#5B6B80" letter-spacing="1">MUSHA ON GOOGLE CLOUD RUN</text>
  <rect x="340" y="116" width="480" height="464" rx="16" fill="#fff" stroke="#0070E0" stroke-width="2"/>
  <g font-size="13" fill="#1A2B42">
    <rect x="362" y="138" width="210" height="96" rx="10" fill="#EAF3FF"/>
    <text x="378" y="164" font-size="15" font-weight="700" fill="#003087">Requests</text>
    <text x="378" y="186">Chat and voice notes</text>
    <text x="378" y="206">become a priced request</text>
    <rect x="588" y="138" width="210" height="96" rx="10" fill="#EAF3FF"/>
    <text x="604" y="164" font-size="15" font-weight="700" fill="#003087">Agent mandate</text>
    <text x="604" y="186">Approves inside the owner's</text>
    <text x="604" y="206">limits, asks for stock itself</text>
    <rect x="362" y="250" width="436" height="110" rx="10" fill="#003087"/>
    <text x="380" y="278" font-size="16" font-weight="700" fill="#fff">Proof engine</text>
    <text x="380" y="302" fill="#CFE3FF">Receipt read · payee · price · duplicate · date · goods photo · camera</text>
    <text x="380" y="326" fill="#CFE3FF">Score 85+ releases what the receipt shows, capped at the hold</text>
    <text x="380" y="348" fill="#CFE3FF">Below that, Musha asks the manager or the owner</text>
    <rect x="362" y="376" width="210" height="88" rx="10" fill="#EAF3FF"/>
    <text x="378" y="402" font-size="15" font-weight="700" fill="#003087">Books</text>
    <text x="378" y="424">One line per PayPal ID</text>
    <text x="378" y="444">capture:, returned:, stock:</text>
    <rect x="588" y="376" width="210" height="88" rx="10" fill="#EAF3FF"/>
    <text x="604" y="402" font-size="15" font-weight="700" fill="#003087">Hold job</text>
    <text x="604" y="424">Reauthorizes after day 3</text>
    <text x="604" y="444">Returns before day 29</text>
    <rect x="362" y="480" width="436" height="80" rx="10" fill="#F5F7FA" stroke="#D6DEE8"/>
    <text x="378" y="506" font-size="15" font-weight="700" fill="#003087">Gemini 3.8 Flash and Gemini Live</text>
    <text x="378" y="528">Reads receipts, stills and chat · translates · speaks for the shop</text>
    <text x="378" y="548" fill="#5B6B80">Musha runs on plain rules when the model is off</text>
  </g>

  <!-- PayPal -->
  <text x="880" y="102" font-size="13" font-weight="700" fill="#5B6B80" letter-spacing="1">PAYPAL</text>
  <rect x="880" y="116" width="288" height="464" rx="16" fill="#0070E0"/>
  <g font-size="13" fill="#fff">
    <text x="902" y="150" font-size="15" font-weight="700">Orders v2 · Authorize</text>
    <text x="902" y="170" fill="#D6E9FF">Hold the owner's money</text>
    <text x="902" y="208" font-size="15" font-weight="700">Vault v3</text>
    <text x="902" y="228" fill="#D6E9FF">Agent places merchant-initiated holds</text>
    <text x="902" y="266" font-size="15" font-weight="700">Capture · Void</text>
    <text x="902" y="286" fill="#D6E9FF">Release what is proven, return the rest</text>
    <text x="902" y="324" font-size="15" font-weight="700">Payouts</text>
    <text x="902" y="344" fill="#D6E9FF">To the shop's PayPal, and wages</text>
    <text x="902" y="382" font-size="15" font-weight="700">Transaction Search</text>
    <text x="902" y="402" fill="#D6E9FF">Matches PayPal to the books</text>
    <text x="902" y="440" font-size="15" font-weight="700">Webhooks</text>
    <text x="902" y="460" fill="#D6E9FF">Post to the same ledger references</text>
    <text x="902" y="498" font-size="15" font-weight="700">Agent Toolkit</text>
    <text x="902" y="518" fill="#D6E9FF">Read-only tools write the summary</text>
    <text x="902" y="556" font-size="12" fill="#D6E9FF">PayPal-Request-Id on every POST</text>
  </g>

  <!-- Arrows -->
  <g stroke="#0070E0" stroke-width="2.5" fill="none">
    <path d="M282 190 L340 190" marker-end="url(#a)"/>
    <path d="M282 375 L340 375" marker-end="url(#a)"/>
    <path d="M282 532 L340 532" marker-end="url(#a)"/>
    <path d="M820 230 L880 230" marker-end="url(#a)"/>
    <path d="M880 330 L820 330" marker-end="url(#a)"/>
    <path d="M820 420 L880 420" marker-end="url(#a)"/>
  </g>

  <!-- Bottom strip -->
  <rect x="32" y="608" width="1136" height="64" rx="14" fill="#fff" stroke="#D6DEE8"/>
  <text x="56" y="646" font-size="14" fill="#1A2B42"><tspan font-weight="700" fill="#003087">Channels</tspan>   WhatsApp Business Cloud API carries the manager's thread · WebSocket to Gemini Live for the shop call · Cloud Scheduler runs the hold job</text>
</svg>
