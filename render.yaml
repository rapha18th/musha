# Musha on Render: the API and the built web app in one service, Postgres, and a hold keeper.
# Create it from Dashboard > New > Blueprint, or with the Deploy to Render button in the README.
# Cost: Basic Postgres US$6 a month, the cron US$1 a month, the web service free.

envVarGroups:
  - name: musha-jobs
    envVars:
      - key: MUSHA_JOBS_KEY
        generateValue: true

services:
  - type: web
    name: musha
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      pip install --no-deps paypal-agent-toolkit==1.11.0 &&
      cd frontend && node --version && npm ci --include=dev && npm run build
    startCommand: >-
      cd backend && python -m musha.seed --if-empty &&
      uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: 24.22.1
      - key: PAYPAL_ENV
        value: sandbox
      - key: MUSHA_PAYPAL
        value: sandbox
      - key: MUSHA_CURRENCY
        value: USD
      - key: MUSHA_JOBS_EVERY_MINUTES
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: musha-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: MUSHA_OWNER_EMAIL
        sync: false
      - key: MUSHA_MANAGER_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - fromGroup: musha-jobs

  # Every 10 minutes: reauthorize and close holds on time, retry release payouts,
  # and keep the free web service awake (it sleeps after 15 quiet minutes).
  - type: cron
    name: musha-holds
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    schedule: "*/10 * * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsS --retry 6 --retry-delay 20 --max-time 120 -d ''
      -H "X-Jobs-Key: $MUSHA_JOBS_KEY"
      "https://$MUSHA_HOST/api/jobs/holds"
    envVars:
      - key: MUSHA_HOST
        fromService:
          name: musha
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - fromGroup: musha-jobs

databases:
  # Basic, never free: a free database expires after 30 days.
  - name: musha-db
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: frankfurt
    databaseName: musha
    user: musha
    ipAllowList: []
